<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Cadence">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#6366F1"/>
      <stop offset="55%"  stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <linearGradient id="arc" x1="0.1" y1="0.95" x2="0.9" y2="0.05">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="60%"  stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#tile)"/>

  <!-- Time elapsing: a ring that fades in as it comes round. -->
  <g transform="rotate(-90 256 256)">
    <circle cx="256" cy="256" r="150" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="34"/>
    <circle cx="256" cy="256" r="150" fill="none" stroke="url(#arc)" stroke-width="34"
            stroke-linecap="round" stroke-dasharray="660 943" stroke-dashoffset="0"/>
  </g>

  <!-- and resolving into a completed thing. -->
  <path d="M182 264 L233 315 L332 202" fill="none" stroke="#FFFFFF" stroke-width="42"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
