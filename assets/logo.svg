<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64" role="img" aria-label="Klasso">
  <!-- Single source of truth for the app mark. Geometry is mirrored by
       AnimatedBrandMark in src/components/icons.tsx — keep the two in step. -->
  <defs>
    <linearGradient id="bm-tile" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#4E9376"/>
      <stop offset="52%" stop-color="#2E6C55"/>
      <stop offset="100%" stop-color="#1B4E3B"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14.25" fill="url(#bm-tile)"/>

  <!-- the day, as a ring -->
  <g transform="rotate(-90 32 32)" fill="none" stroke="#FFFFFF" stroke-width="3.75">
    <circle cx="32" cy="32" r="19" stroke-opacity=".16"/>
    <circle cx="32" cy="32" r="19" stroke-linecap="round" stroke-dasharray="83.57 119.38"/>
  </g>

  <!-- the schedule inside it -->
  <g fill="none" stroke="#FFFFFF" stroke-width="3.75" stroke-linecap="round">
    <path d="M22.5 25H37.25" stroke-opacity=".55"/>
    <path d="M22.5 32H41.5"/>
    <path d="M22.5 39H33.25" stroke-opacity=".55"/>
  </g>

  <!-- "now" -->
  <circle cx="14" cy="38" r="3.1" fill="#1B4E3B"/>
  <circle cx="14" cy="38" r="2.1" fill="#EFC873"/>
</svg>
